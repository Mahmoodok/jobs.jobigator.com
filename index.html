<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs | Jobigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black text-brand-600 tracking-tight">Jobigator<span class="text-xs text-gray-400 font-normal">.com</span></span>
      </div>

      <!-- User Profile / Auth Area -->
      <div id="authArea">
        <!-- JS injects Profile or Sign In Button -->
      </div>
    </div>
  </header>

  <!-- SEARCH & FILTERS SECTION -->
  <section class="bg-gradient-to-b from-brand-50 to-gray-50 py-8 border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-4">
      
      <!-- Search Input Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="relative">
          <i class="fa-solid fa-briefcase absolute left-3 top-3.5 text-gray-400"></i>
          <input type="text" id="searchRole" placeholder="Role, keyword, or title" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-600 focus:outline-none">
        </div>
        <div class="relative">
          <i class="fa-solid fa-building absolute left-3 top-3.5 text-gray-400"></i>
          <input type="text" id="searchCompany" placeholder="Company name" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-600 focus:outline-none">
        </div>
        <div class="relative">
          <i class="fa-solid fa-location-dot absolute left-3 top-3.5 text-gray-400"></i>
          <input type="text" id="searchLocation" placeholder="Location or Remote" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-600 focus:outline-none">
        </div>
      </div>

      <!-- Dropdown Filters -->
      <div class="flex flex-wrap items-center gap-3 pt-2">
        <select id="filterType" class="px-3 py-2 bg-white rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-brand-600">
          <option value="">All Job Types</option>
          <option value="Full Time">Full Time</option>
          <option value="Part Time">Part Time</option>
          <option value="Contract">Contract</option>
          <option value="Remote">Remote</option>
          <option value="Internship">Internship</option>
        </select>

        <select id="filterSalary" class="px-3 py-2 bg-white rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-brand-600">
          <option value="">All Salary Ranges</option>
          <option value="Disclosed">Salary Mentioned</option>
        </select>

        <button onclick="resetFilters()" class="text-xs text-brand-700 font-semibold hover:underline ml-auto">Clear Filters</button>
      </div>
    </div>
  </section>

  <!-- MAIN JOB LISTING AREA -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="loader" class="text-center py-16">
      <i class="fa-solid fa-circle-notch animate-spin text-4xl text-brand-600"></i>
      <p class="text-gray-500 mt-2 text-sm">Fetching fresh opportunities...</p>
    </div>

    <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- Cards rendered via JS -->
    </div>

    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-2"></i>
      <p class="text-gray-600 font-medium">No matching active jobs found.</p>
    </div>
  </main>

  <!-- SIGN UP MODAL -->
  <div id="signUpModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h2 class="text-2xl font-bold text-gray-900 mb-1">Welcome to Jobigator</h2>
      <p class="text-sm text-gray-500 mb-6">Create a free account to save jobs and track your applications.</p>

      <form id="signUpForm" onsubmit="handleSignUpSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Full Name</label>
          <input type="text" id="suName" required placeholder="e.g. Rahul Sharma" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">WhatsApp Number</label>
          <input type="tel" id="suPhone" required placeholder="+91 9876543210" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email Address</label>
          <input type="email" id="suEmail" required placeholder="rahul@example.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-600 outline-none">
        </div>

        <button type="submit" id="suSubmitBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg transition shadow-md">
          Complete Free Sign-Up
        </button>
      </form>

      <div class="mt-4 pt-4 border-t text-center">
        <button onclick="closeModal('signUpModal')" class="text-sm text-gray-500 hover:text-gray-800">
          Continue without signing up
        </button>
      </div>
    </div>
  </div>

  <!-- APPLY MODAL -->
  <div id="applyModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative text-center">
      <button onclick="closeModal('applyModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      
      <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-paper-plane text-xl"></i>
      </div>
      
      <h3 id="applyModalTitle" class="text-lg font-bold text-gray-900">Apply for Job</h3>
      <p id="applyModalCompany" class="text-xs text-gray-500 mb-6"></p>

      <div class="space-y-3">
        <a id="directApplyBtn" href="#" target="_blank" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Apply Directly
        </a>
        <a id="getHelpBtn" href="#" target="_blank" class="w-full py-3 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium rounded-lg flex items-center justify-center gap-2 border border-emerald-200 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i> Get Help
        </a>
      </div>
    </div>
  </div>

  <!-- SAVED JOBS MODAL -->
  <div id="savedJobsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl relative max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b">
        <h3 class="text-xl font-bold text-gray-900"><i class="fa-solid fa-bookmark text-brand-600 mr-2"></i>Saved Jobs</h3>
        <button onclick="closeModal('savedJobsModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="savedJobsList" class="overflow-y-auto py-4 space-y-3 flex-grow">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // Configuration
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzr2RTzuIxFPw5lIIge84IWTRveWKTf5OqCVlXL4_curFbWwpKs6slAlHgD7qDFABzv/exec"; 
    const WHATSAPP_NUMBER = "917013681638";

    // State Variables
    let allJobs = [];
    let currentUser = JSON.parse(localStorage.getItem('jobigator_user')) || null;
    let currentApplyingJob = null;

    // Initial Load
    document.addEventListener("DOMContentLoaded", () => {
      renderAuthArea();
      fetchJobs();

      // Show Sign Up Modal on first visit if user is not signed in
      if (!currentUser && !localStorage.getItem('jobigator_dismissed_signup')) {
        setTimeout(() => { openModal('signUpModal'); }, 1200);
      }

      // Event Listeners for Filters
      document.getElementById('searchRole').addEventListener('input', filterJobs);
      document.getElementById('searchCompany').addEventListener('input', filterJobs);
      document.getElementById('searchLocation').addEventListener('input', filterJobs);
      document.getElementById('filterType').addEventListener('change', filterJobs);
      document.getElementById('filterSalary').addEventListener('change', filterJobs);
    });

    // Fetch Jobs from Apps Script
    async function fetchJobs() {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getJobs`);
        const data = await response.json();

        if (data.status === "success") {
          allJobs = data.jobs;
          renderJobs(allJobs);
        }
      } catch (err) {
        console.error("Error fetching jobs:", err);
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    // Render Cards Grid
    function renderJobs(jobs) {
      const grid = document.getElementById('jobGrid');
      const noResults = document.getElementById('noResults');

      grid.innerHTML = '';

      if (jobs.length === 0) {
        grid.classList.add('hidden');
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.classList.remove('hidden');

      jobs.forEach(job => {
        const isSaved = currentUser && currentUser.savedJobs && currentUser.savedJobs.includes(job.jobId);
        
        const card = document.createElement('div');
        card.className = "bg-white border rounded-2xl p-5 shadow-sm hover:shadow-md transition relative flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <!-- Top Tag Line -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-semibold px-2.5 py-1 bg-brand-50 text-brand-700 rounded-md border border-brand-100">
                ${escapeHtml(job.jobCategory || 'General')}
              </span>
              ${job.featured ? `<span class="text-xs font-semibold px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full flex items-center gap-1"><i class="fa-solid fa-star text-amber-500 text-[10px]"></i> Featured</span>` : ''}
            </div>

            <!-- Job Title & Company -->
            <h3 class="text-lg font-bold text-gray-900 leading-snug">${escapeHtml(job.jobTitle)}</h3>
            <p class="text-sm font-medium text-gray-600 mb-3">${escapeHtml(job.company)} ${job.companyCategory ? `<span class="text-gray-400 font-normal">(${escapeHtml(job.companyCategory)})</span>` : ''}</p>

            <!-- Meta info -->
            <div class="space-y-1.5 text-xs text-gray-500 mb-4">
              <div class="flex items-center gap-2"><i class="fa-solid fa-location-dot w-4 text-gray-400"></i> ${escapeHtml(job.location)}</div>
              <div class="flex items-center gap-2"><i class="fa-solid fa-briefcase w-4 text-gray-400"></i> ${escapeHtml(job.jobType)}</div>
              <div class="flex items-center gap-2"><i class="fa-solid fa-wallet w-4 text-gray-400"></i> ${escapeHtml(job.salary || 'Not Disclosed')}</div>
              <div class="flex items-center gap-2"><i class="fa-solid fa-clock w-4 text-gray-400"></i> Posted: ${job.postedOn}</div>
            </div>

            <!-- Description -->
            <p class="text-xs text-gray-600 line-clamp-3 mb-6">${escapeHtml(job.description)}</p>
          </div>

          <!-- Card Actions Grid -->
          <div class="pt-3 border-t grid grid-cols-4 gap-2">
            <button onclick="openApplyModal('${job.jobId}')" class="col-span-2 py-2 px-3 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-lg transition text-center">
              Apply
            </button>
            <button onclick="directHelp('${job.jobId}')" class="py-2 px-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold rounded-lg border border-emerald-200 transition text-center" title="Get Help on WhatsApp">
              <i class="fa-brands fa-whatsapp text-sm"></i> Help
            </button>
            <button onclick="toggleSave('${job.jobId}')" class="py-2 px-2 ${isSaved ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-gray-50 text-gray-600 border-gray-200'} border text-xs font-semibold rounded-lg transition text-center flex items-center justify-center gap-1">
              <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
            </button>
          </div>
          
          <div class="mt-2 text-right">
            <button onclick="shareJob('${job.jobId}')" class="text-[11px] text-gray-400 hover:text-gray-600 font-medium">
              <i class="fa-solid fa-share-nodes"></i> Share Job
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Filter Logic
    function filterJobs() {
      const role = document.getElementById('searchRole').value.toLowerCase();
      const company = document.getElementById('searchCompany').value.toLowerCase();
      const location = document.getElementById('searchLocation').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const salary = document.getElementById('filterSalary').value;

      const filtered = allJobs.filter(j => {
        const matchRole = j.jobTitle.toLowerCase().includes(role) || j.jobCategory.toLowerCase().includes(role);
        const matchCompany = j.company.toLowerCase().includes(company);
        const matchLoc = j.location.toLowerCase().includes(location);
        const matchType = type === "" || j.jobType.toLowerCase() === type.toLowerCase();
        const matchSalary = salary === "" || (j.salary && j.salary.toLowerCase() !== "not disclosed");

        return matchRole && matchCompany && matchLoc && matchType && matchSalary;
      });

      renderJobs(filtered);
    }

    function resetFilters() {
      document.getElementById('searchRole').value = '';
      document.getElementById('searchCompany').value = '';
      document.getElementById('searchLocation').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterSalary').value = '';
      renderJobs(allJobs);
    }

    // Apply Modal Handlers
    function openApplyModal(jobId) {
      const job = allJobs.find(j => j.jobId === jobId);
      if (!job) return;

      currentApplyingJob = job;
      document.getElementById('applyModalTitle').innerText = job.jobTitle;
      document.getElementById('applyModalCompany').innerText = `${job.company} • ${job.location}`;
      document.getElementById('directApplyBtn').href = job.link || '#';

      const waMsg = encodeURIComponent(`Hello Jobigator, I need assistance applying for the position:\n\n*Job Title:* ${job.jobTitle}\n*Job ID:* ${job.jobId}\n*Company:* ${job.company}`);
      document.getElementById('getHelpBtn').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;

      openModal('applyModal');
    }

    function directHelp(jobId) {
      const job = allJobs.find(j => j.jobId === jobId);
      if (!job) return;
      const waMsg = encodeURIComponent(`Hello Jobigator, I have a query regarding:\n\n*Job:* ${job.jobTitle} (ID: ${job.jobId})\n*Company:* ${job.company}`);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`, '_blank');
    }

    // Save Job Handler
    async function toggleSave(jobId) {
      if (!currentUser) {
        alert("Saving jobs is only available for signed-in users.");
        openModal('signUpModal');
        return;
      }

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=toggleSaveJob&email=${encodeURIComponent(currentUser.email)}&jobId=${encodeURIComponent(jobId)}`);
        const data = await response.json();

        if (data.status === "limit_reached") {
          alert("You can only save up to 10 jobs. Please remove a job from your saved list before adding a new one.");
          return;
        }

        if (data.status === "success") {
          currentUser.savedJobs = data.savedJobs;
          localStorage.setItem('jobigator_user', JSON.stringify(currentUser));
          renderJobs(allJobs);
          renderAuthArea();
        }
      } catch (err) {
        console.error("Error saving job:", err);
      }
    }

    // Share Handler
    function shareJob(jobId) {
      const job = allJobs.find(j => j.jobId === jobId);
      if (!job) return;

      const portalUrl = window.location.href;
      const text = `Check out this opening for ${job.jobTitle} at ${job.company}: ${portalUrl}`;

      const choice = confirm("Click OK to share on WhatsApp, or Cancel to share on LinkedIn.");
      if (choice) {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      } else {
        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(portalUrl)}`, '_blank');
      }
    }

    // Sign Up Handler
    async function handleSignUpSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('suSubmitBtn');
      btn.innerText = "Signing Up...";
      btn.disabled = true;

      const name = document.getElementById('suName').value;
      // Remove any stray spaces or special characters except '+'
const phone = document.getElementById('suPhone').value.replace(/[^\d+]/g, '');
      const email = document.getElementById('suEmail').value;

      try {
        const url = `${APPS_SCRIPT_URL}?action=signup&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&email=${encodeURIComponent(email)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.status === "success") {
          currentUser = data.user;
          localStorage.setItem('jobigator_user', JSON.stringify(currentUser));
          closeModal('signUpModal');
          renderAuthArea();
          renderJobs(allJobs);
        } else {
          alert(data.message || "Failed to sign up.");
        }
      } catch (err) {
        alert("An error occurred during sign up.");
      } finally {
        btn.innerText = "Complete Free Sign-Up";
        btn.disabled = false;
      }
    }

    // Render User Header Profile State
    function renderAuthArea() {
      const authArea = document.getElementById('authArea');
      if (currentUser) {
        const count = currentUser.savedJobs ? currentUser.savedJobs.length : 0;
        authArea.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="openSavedJobsModal()" class="text-xs font-semibold px-3 py-1.5 bg-brand-50 text-brand-700 hover:bg-brand-100 rounded-lg border border-brand-200 transition flex items-center gap-1.5">
              <i class="fa-solid fa-bookmark"></i> Saved (${count}/10)
            </button>
            <div class="text-right hidden sm:block">
              <p class="text-xs font-bold text-gray-900">${escapeHtml(currentUser.name)}</p>
              <p class="text-[10px] text-gray-500">${escapeHtml(currentUser.email)}</p>
            </div>
            <button onclick="signOut()" class="text-xs text-gray-400 hover:text-red-600 p-1" title="Sign Out">
              <i class="fa-solid fa-right-from-bracket text-base"></i>
            </button>
          </div>
        `;
      } else {
        authArea.innerHTML = `
          <button onclick="openModal('signUpModal')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-lg shadow-sm transition">
            Free Sign-Up
          </button>
        `;
      }
    }

    // Open Saved Jobs Modal
    function openSavedJobsModal() {
      const list = document.getElementById('savedJobsList');
      list.innerHTML = '';

      if (!currentUser || !currentUser.savedJobs || currentUser.savedJobs.length === 0) {
        list.innerHTML = `<p class="text-sm text-gray-500 text-center py-6">You haven't saved any jobs yet.</p>`;
        openModal('savedJobsModal');
        return;
      }

      currentUser.savedJobs.forEach(savedId => {
        const activeJob = allJobs.find(j => j.jobId === savedId);
        const item = document.createElement('div');
        item.className = "p-3 border rounded-xl flex items-center justify-between gap-3 bg-gray-50";

        if (activeJob) {
          item.innerHTML = `
            <div>
              <h4 class="text-sm font-bold text-gray-900">${escapeHtml(activeJob.jobTitle)}</h4>
              <p class="text-xs text-gray-500">${escapeHtml(activeJob.company)} • ${escapeHtml(activeJob.location)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openApplyModal('${activeJob.jobId}')" class="px-3 py-1 bg-brand-600 text-white text-xs font-semibold rounded-md">Apply</button>
              <button onclick="toggleSave('${activeJob.jobId}')" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
            </div>
          `;
        } else {
          // Expired or deleted job handling
          item.innerHTML = `
            <div>
              <h4 class="text-sm font-bold text-gray-400 line-through">Job ID: ${savedId}</h4>
              <p class="text-xs text-red-500 font-medium">This job has expired or was removed from our database.</p>
            </div>
            <button onclick="toggleSave('${savedId}')" class="text-gray-400 hover:text-red-600 p-1" title="Remove"><i class="fa-solid fa-trash-can text-sm"></i></button>
          `;
        }
        list.appendChild(item);
      });

      openModal('savedJobsModal');
    }

    function signOut() {
      localStorage.removeItem('jobigator_user');
      currentUser = null;
      renderAuthArea();
      renderJobs(allJobs);
    }

    // Modal Helpers
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'signUpModal') {
        localStorage.setItem('jobigator_dismissed_signup', 'true');
      }
    }

    // Utilities
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
